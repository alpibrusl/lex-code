name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lex-code

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-llm
          path: lex-llm

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-agent
          path: lex-agent

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-trail
          path: lex-trail

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-spec
          path: lex-spec

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-schema
          path: lex-schema

      - name: Install Lex toolchain
        run: |
          set -euxo pipefail
          LEX_VERSION="0.10.7"
          curl -fsSL -o /tmp/lex.tgz \
            "https://github.com/alpibrusl/lex-lang/releases/download/v${LEX_VERSION}/lex-v${LEX_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/lex.tgz -C /tmp/
          echo "/tmp/lex-v${LEX_VERSION}-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
          "/tmp/lex-v${LEX_VERSION}-x86_64-unknown-linux-gnu/lex" --version

      - name: Install package dependencies
        run: lex pkg install
        working-directory: lex-code

      - name: Link sibling packages into global cache for transitive resolution
        run: |
          mkdir -p ~/.lex/packages
          for pkg in lex-llm lex-agent lex-trail lex-spec lex-schema; do
            test -e ~/.lex/packages/$pkg || ln -sfn "$(realpath ../$pkg)" ~/.lex/packages/$pkg
          done
        working-directory: lex-code

      - name: Type-check src/
        run: |
          set -e
          fail=0
          for f in $(git ls-files src/ | grep '\.lex$'); do
            if ! lex check "$f" >/dev/null 2>&1; then
              echo "::error file=$f::lex check failed"
              lex check "$f" 2>&1 | head -3
              fail=1
            fi
          done
          exit $fail
        working-directory: lex-code

      - name: Format check
        run: lex fmt --check src/
        working-directory: lex-code

      - name: Manifesto demos
        run: |
          set -e
          echo "== effect-typed parallel orchestration must type-check =="
          lex check examples/manifesto_parallel.lex
          echo "== negative twin (missing [concurrent]) must be REJECTED =="
          if lex check examples/manifesto_parallel_bad.lex >/dev/null 2>&1; then
            echo "::error::manifesto_parallel_bad.lex type-checked but must be rejected"
            exit 1
          fi
          echo "== semantic diff must surface the effect-row change =="
          bash examples/manifesto_semantic_diff/run.sh
        working-directory: lex-code
