name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lex-code
          # Full history: the minimum-bar secret scan reads `git log`,
          # and on the default depth-1 checkout it would only ever see
          # the tip commit while reporting that it had looked.
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-llm
          path: lex-llm

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-agent
          path: lex-agent

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-trail
          path: lex-trail

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-spec
          path: lex-spec

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-schema
          path: lex-schema

      - name: Install Lex toolchain
        run: |
          set -euxo pipefail
          LEX_VERSION="0.10.13"
          # Backed off and limited: the release CDN returns a 504 often
          # enough to redden a build on its own, and re-running the job
          # by hand is not a fix. Retries are safe here — the request is
          # a GET of an immutable release asset.
          curl -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 --retry-connrefused \
            -o /tmp/lex.tgz \
            "https://github.com/alpibrusl/lex-lang/releases/download/v${LEX_VERSION}/lex-v${LEX_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/lex.tgz -C /tmp/
          echo "/tmp/lex-v${LEX_VERSION}-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
          "/tmp/lex-v${LEX_VERSION}-x86_64-unknown-linux-gnu/lex" --version

      - name: Install package dependencies
        run: lex pkg install
        working-directory: lex-code

      - name: Link sibling packages into global cache for transitive resolution
        run: |
          mkdir -p ~/.lex/packages
          for pkg in lex-llm lex-agent lex-trail lex-spec lex-schema; do
            test -e ~/.lex/packages/$pkg || ln -sfn "$(realpath ../$pkg)" ~/.lex/packages/$pkg
          done
        working-directory: lex-code

      - name: Type-check src/
        run: |
          set -e
          fail=0
          for f in $(git ls-files src/ tests/ | grep '\.lex$'); do
            if ! lex check "$f" >/dev/null 2>&1; then
              echo "::error file=$f::lex check failed"
              lex check "$f" 2>&1 | head -3
              fail=1
            fi
          done
          exit $fail
        working-directory: lex-code

      - name: Format check
        run: lex fmt --check src/ tests/
        working-directory: lex-code

      # AGENTS.md must match the pinned toolchain's lex agent-guidelines
      # (docsync.toml declares it; shared mechanism from lex-lang#747).
      - name: Generated docs current (doc-sync --check)
        run: lex doc-sync --check
        working-directory: lex-code

      # Offline unit tests (#54 introduced tests/): per-test file DBs under
      # /tmp, no provider keys, no network.
      - name: Test
        run: lex test --allow-effects crypto,fs_read,fs_write,io,random,sql,time tests
        working-directory: lex-code

      # The minimum bar (src/bar/ledger.lex), applied to lex-code
      # itself. Only `fail` verdicts break the build — `partial` is the
      # honest state for an item a probe can only half-answer, and a
      # gate that treated it as an error would push the next author to
      # weaken the probe instead of answering the question.
      - name: Minimum bar (self-check)
        run: lex run --allow-effects io,proc src/bar/checks.lex gate '"."' '"src"'
        working-directory: lex-code

      # The ACP wire format was a guess until it was checked: tool_call and
      # tool_call_update both omitted the required toolCallId, and initialize
      # answered with a protocol version that does not exist. The schema is
      # the published one, so a shape change fails here rather than in
      # someone's editor. Model is mocked — this tests the protocol.
      - name: ACP wire format against the published schema
        run: |
          set -e
          npm pack @zed-industries/agent-client-protocol@0.4.5 >/dev/null
          tar -xzf zed-industries-agent-client-protocol-*.tgz
          python3 -m pip install --quiet jsonschema
          python3 scripts/validate_acp.py package/schema/schema.json
        working-directory: lex-code

      - name: Manifesto demos
        run: |
          set -e
          echo "== effect-typed parallel orchestration must type-check =="
          lex check examples/manifesto_parallel.lex
          echo "== negative twin (missing [concurrent]) must be REJECTED =="
          if lex check examples/manifesto_parallel_bad.lex >/dev/null 2>&1; then
            echo "::error::manifesto_parallel_bad.lex type-checked but must be rejected"
            exit 1
          fi
          echo "== semantic diff must surface the effect-row change =="
          bash examples/manifesto_semantic_diff/run.sh
        working-directory: lex-code
