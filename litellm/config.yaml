litellm_settings:
  drop_params: true
  request_timeout: 120
  num_retries: 2

general_settings:
  # Enables Claude Code Max subscription forwarding.
  # Claude Code must be configured with ANTHROPIC_BASE_URL=http://localhost:4000
  forward_client_headers_to_llm_api: true
  # Uncomment to require a key on all requests:
  # master_key: os.environ/LITELLM_API_KEY
