# LiteLLM proxy config for lex-code — kept in sync with lex-loom's own
# litellm/config.yaml (same model list, including the OpenCode Go plan)
# since both repos are meant to work against the same proxy instance.
#
# Two auth modes:
#
# 1. API keys (Anthropic / OpenAI):
#    Set ANTHROPIC_API_KEY and/or OPENAI_API_KEY in your environment before
#    running docker compose, then use model names like claude-sonnet-4-6.
#
# 2. ChatGPT subscription (no API key needed):
#    The chatgpt/* entries below are commented out by default — confirmed
#    live (2026-09-24) that LiteLLM actually resolves the device-code OAuth
#    flow at PROXY BOOT for every configured chatgpt/* model, not lazily
#    "on first request" as this comment used to claim: the proxy prints the
#    device code and the HTTP server never finishes starting (TCP connects,
#    every request gets an empty reply) until that flow completes — which
#    blocks the proxy for EVERY model, including totally unrelated ones like
#    the embeddings entry semantic search needs. Uncomment the block below
#    only if you're at a terminal ready to complete the device flow when you
#    start the proxy.
#
# 3. Claude Code Max subscription:
#    forward_client_headers_to_llm_api forwards the OAuth token that Claude
#    Code places in the Authorization header. Set ANTHROPIC_BASE_URL=http://localhost:4000
#    in Claude Code's env to route it through this proxy for cost tracking.
#    Note: lex-code itself still needs ANTHROPIC_API_KEY to talk to Claude.
#
# 4. OpenCode Go plan (see the "OpenCode Go plan" section below):
#    Set OPENCODE_API_KEY before docker compose up, then point LITELLM_MODEL
#    at any entry in that section (deepseek-v4-flash, qwen3.7-max, kimi-k3, ...).
#    Prefer this over lex-code's native --opencode flag when you want a single
#    proxy shared with lex-loom, request-timeout/retry policy, or cost tracking.
#
# Usage:
#   cd litellm
#   ANTHROPIC_API_KEY=... OPENAI_API_KEY=... OPENCODE_API_KEY=... docker compose up -d
#
#   # lex-code via API key:
#   LITELLM_BASE_URL=http://localhost:4000 LITELLM_MODEL=claude-sonnet-4-6 \
#     lex run --allow-effects env,io,net,llm,proc,sql,fs_write,time src/tui/main.lex main -- --litellm "implement list.zip"
#
#   # lex-code via OpenCode Go through the proxy:
#   LITELLM_BASE_URL=http://localhost:4000 LITELLM_MODEL=kimi-k2.7-code \
#     lex run --allow-effects env,io,net,llm,proc,sql,fs_write,time src/tui/main.lex main -- --litellm "implement list.zip"
#
#   # lex-code via ChatGPT subscription:
#   LITELLM_BASE_URL=http://localhost:4000 LITELLM_MODEL=chatgpt/gpt-5.3-chat-latest \
#     lex run --allow-effects env,io,net,llm,proc,sql,fs_write,time src/tui/main.lex main -- --litellm "implement list.zip"

model_list:

  # ── Ollama local models (host machine) ────────────────────────────────────
  # Requires Ollama running on the host at port 11434.
  # From Docker: api_base uses host.docker.internal (add extra_hosts in compose).
  # From host: set OLLAMA_HOST=http://localhost:11434 or leave default.
  #
  # Recommended for code tasks: qwen3-coder:30b
  #   ollama pull qwen3-coder:30b
  #   LITELLM_BASE_URL=http://localhost:4000 MODEL=qwen3-coder:30b lex run src/main.lex
  #
  # NOTE on thinking models (gemma4:26b, deepseek-r1):
  #   These models spend 500-700 tokens on chain-of-thought BEFORE producing output.
  #   max_tokens must be >= 2000 or they return empty content. merge_reasoning_content_in_choices
  #   is required so the visible text is not silently dropped by LiteLLM.
  #   Tool calling with these models is unreliable under large context (10+ tools).
  #   Prefer qwen3-coder:30b or devstral-small-2 for code agent tasks.

  - model_name: qwen3-coder:30b
    litellm_params:
      model: ollama/qwen3-coder:30b
      api_base: http://host.docker.internal:11434

  # ── Embeddings (semantic_search / src/index_build.lex) ──────────────────
  # nomic-embed-text is 768-dim, ~270MB, and runs on CPU. Pull it with
  #   ollama pull nomic-embed-text
  # lex-code talks OpenAI's /v1/embeddings shape, so it reaches Ollama
  # through this proxy rather than through Ollama's native /api/embeddings.
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434

  - model_name: devstral-small-2:latest
    litellm_params:
      model: ollama/devstral-small-2:latest
      api_base: http://host.docker.internal:11434

  - model_name: gemma4:26b
    litellm_params:
      model: ollama/gemma4:26b
      api_base: http://host.docker.internal:11434
      merge_reasoning_content_in_choices: true

  - model_name: gemma4:latest
    litellm_params:
      model: ollama/gemma4:latest
      api_base: http://host.docker.internal:11434
      merge_reasoning_content_in_choices: true

  # ── Anthropic API key ──────────────────────────────────────────────────────
  - model_name: claude-opus-4-7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # ── OpenAI API key ─────────────────────────────────────────────────────────
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: o3-mini
    litellm_params:
      model: openai/o3-mini
      api_key: os.environ/OPENAI_API_KEY

  # ── ChatGPT subscription (device flow OAuth, no API key needed) ────────────
  # Commented out by default — see the header comment: this blocks proxy
  # boot for every model until the device flow completes. Uncomment only if
  # you're ready to complete it at container start.
  # - model_name: chatgpt/gpt-5.3-chat-latest
  #   litellm_params:
  #     model: chatgpt/gpt-5.3-chat-latest
  #
  # - model_name: chatgpt/gpt-5.4
  #   litellm_params:
  #     model: chatgpt/gpt-5.4
  #
  # - model_name: chatgpt/gpt-5.3-codex
  #   litellm_params:
  #     model: chatgpt/gpt-5.3-codex

  # ── OpenCode Go plan ───────────────────────────────────────────────────────
  # Set OPENCODE_API_KEY=$(cat ~/.credentials/opencode/key) before compose up.
  # All Go plan models run in thinking mode — merge_reasoning_content_in_choices
  # is required on every entry so reasoning traces don't silently replace content.
  #
  # Note: tool_choice=required is rejected by all thinking-mode models.
  # lex-code uses tool_choice=auto (via lex-llm, shared with lex-loom) so
  # this works correctly.

  # Refreshed against the live /v1/models list on 2026-09-16 (38 models).
  # NOTE: deepseek-* return 403 (region-locked to China opt-in) and grok is not
  # oa-compat on this key/plan; they are listed for completeness. kimi-k3 is the
